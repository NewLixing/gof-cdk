name = "gof-cdk-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV namespace for task state storage
[[kv_namespaces]]
binding = "TASKS_KV"
id = "your_kv_namespace_id"

# D1 database for history records
[[d1_databases]]
binding = "DB"
database_name = "gof-cdk-history"
database_id = "your_d1_database_id"

# AI binding for OCR
[ai]
binding = "AI"

# CORS configuration
[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }
